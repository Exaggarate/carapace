services:
  - type: web
    name: carapace
    runtime: docker
    plan: starter
    # The image CMD has no --allow-unconfigured, so a fresh disk with no
    # carapace.json exits before binding. Render has no shell before the first
    # boot, so the flag has to come from the blueprint.
    dockerCommand: node carapace.mjs gateway --allow-unconfigured
    healthCheckPath: /startupz
    envVars:
      - key: CARAPACE_GATEWAY_PORT
        value: "8080"
      - key: CARAPACE_STATE_DIR
        value: /data/.carapace
      - key: CARAPACE_WORKSPACE_DIR
        value: /data/workspace
      - key: CARAPACE_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: carapace-data
      mountPath: /data
      sizeGB: 1
