parent_config: ../../config/swiftlint.yml

included:
  - Sources
  - ShareExtension
  - ActivityWidget
  - WatchApp
  - ../shared/CarapaceKit/Sources/CarapaceChatUI
  - ../shared/CarapaceKit/Sources/CarapaceKit
  - ../shared/CarapaceKit/Sources/CarapaceNativeState
  - ../shared/CarapaceKit/Sources/CarapaceProtocol
  - ../swabble/Sources/SwabbleKit

excluded:
  - ../macos
  - ../macos-mlx-tts
  - ../shared/CarapaceKit/Sources/CarapaceProtocol/GatewayModels.swift

type_body_length:
  warning: 900
  error: 1300

custom_rules:
  carapace_design_colors:
    name: "Carapace design colors"
    excluded:
      - Sources/Design/CarapaceBrand.swift
      - ../shared/CarapaceKit/Sources/CarapaceChatUI/ChatTheme.swift
    regex: '(Color\.accentColor|(^|[^A-Za-z0-9_])\.accentColor\b|Color\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|\.(foregroundStyle|tint|fill|stroke|strokeBorder|background)\(\s*\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|Color\(red:\s*0\s*/\s*255\.0,\s*green:\s*122\s*/\s*255\.0,\s*blue:\s*255\s*/\s*255\.0\))'
    message: "Use CarapaceBrand or CarapaceChatTheme design tokens instead of raw accent/status colors."
    severity: error
