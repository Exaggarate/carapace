name: Carapace
options:
  preGenCommand: node ../../scripts/prepare-apple-mermaid.mjs
  bundleIdPrefix: ai.carapacefoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  CarapaceKit:
    path: ../shared/CarapaceKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 152.0.0

schemes:
  Carapace:
    shared: true
    build:
      targets:
        Carapace: all
    test:
      targets:
        - CarapaceTests
        - CarapaceLogicTests
  CarapaceLogicTests:
    shared: true
    build:
      targets:
        CarapaceLogicTests: all
    test:
      targets:
        - CarapaceLogicTests
  CarapaceUITests:
    shared: true
    build:
      targets:
        CarapaceUITests: all
    test:
      targets:
        - CarapaceUITests
  CarapaceWatchApp:
    shared: true
    build:
      targets:
        CarapaceWatchApp: all
    test:
      targets:
        - CarapaceWatchTests

targets:
  Carapace:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: CarapaceShareExtension
        embed: true
      - target: CarapaceActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: CarapaceWatchApp
      - package: CarapaceKit
      - package: CarapaceKit
        product: CarapaceChatUI
      - package: CarapaceKit
        product: CarapaceProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftformat
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/CarapaceKit/Sources/CarapaceChatUI,$SRCROOT/../shared/CarapaceKit/Sources/CarapaceKit,$SRCROOT/../shared/CarapaceKit/Sources/CarapaceNativeState,$SRCROOT/../shared/CarapaceKit/Sources/CarapaceProtocol,$SRCROOT/../swabble/Sources/SwabbleKit" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftlint
          swiftlint lint --strict --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(CARAPACE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: "$(CARAPACE_CODE_SIGN_ENTITLEMENTS)"
        CODE_SIGN_STYLE: "$(CARAPACE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CARAPACE_DEVELOPMENT_TEAM)"
        CARAPACE_ACTIVE_APP_GROUP_ID: "$(CARAPACE_APP_GROUP_ID)"
        CARAPACE_URL_SCHEME: carapace
        PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(CARAPACE_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: YES
        ENABLE_APP_INTENTS_METADATA_GENERATION: YES
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          CARAPACE_ACTIVE_APP_GROUP_ID: "$(CARAPACE_DEBUG_APP_GROUP_ID)"
          CARAPACE_CODE_SIGN_ENTITLEMENTS: Sources/Carapace.entitlements
          CARAPACE_APNS_ENTITLEMENT_ENVIRONMENT: development
          CARAPACE_URL_SCHEME: carapace-debug
          PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_DEBUG_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
          CARAPACE_PUSH_MODE: localSandbox
          CARAPACE_PUSH_RELAY_BASE_URL: ""
        Release:
          CARAPACE_CODE_SIGN_ENTITLEMENTS: Sources/Carapace.entitlements
          CARAPACE_APNS_ENTITLEMENT_ENVIRONMENT: production
          CARAPACE_PUSH_MODE: localProduction
          CARAPACE_PUSH_RELAY_BASE_URL: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Carapace
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.carapacefoundation.app
            CFBundleURLSchemes:
              - "$(CARAPACE_URL_SCHEME)"
        CFBundleShortVersionString: "$(CARAPACE_MARKETING_VERSION)"
        CarapaceCanonicalVersion: "$(CARAPACE_IOS_VERSION)"
        CarapaceGitCommit: "$(CARAPACE_GIT_COMMIT)"
        CarapaceBuildTimestamp: "$(CARAPACE_BUILD_TIMESTAMP)"
        CarapaceAppGroupIdentifier: "$(CARAPACE_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(CARAPACE_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - fetch
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).bgrefresh"
        NSLocalNetworkUsageDescription: Carapace discovers and connects to your Carapace gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _carapace-gw._tcp
        NSCameraUsageDescription: Carapace uses the camera when you scan a Gateway setup QR code or ask your paired Gateway or assistant to capture a photo or short video from this iPhone, for example to connect to your Gateway or show your assistant a document, device screen, or workspace.
        NSCalendarsUsageDescription: Carapace uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: Carapace uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: Carapace uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: Carapace uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: Carapace uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Carapace can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Carapace uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: Carapace may use motion data to support device-aware interactions and automations.
        NSHealthShareUsageDescription: Carapace reads your steps, sleep, resting heart rate, and workouts from the Apple Health app to create summaries you request and send them through your Gateway to your configured AI provider.
        NSHealthUpdateUsageDescription: Carapace does not write to the Apple Health app. It uses read-only data to create summaries you request and send them through your Gateway to your configured AI provider.
        NSPhotoLibraryUsageDescription: Carapace lets your assistant read photos you allow and lets you choose photos to share.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: Carapace uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: Carapace uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        CarapacePushMode: "$(CARAPACE_PUSH_MODE)"
        CarapacePushRelayBaseURL: "$(CARAPACE_PUSH_RELAY_BASE_URL)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  CarapaceShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: CarapaceKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(CARAPACE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/CarapaceShareExtension.entitlements
        CODE_SIGN_STYLE: "$(CARAPACE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CARAPACE_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        CARAPACE_ACTIVE_APP_GROUP_ID: "$(CARAPACE_APP_GROUP_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(CARAPACE_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CARAPACE_ACTIVE_APP_GROUP_ID: "$(CARAPACE_DEBUG_APP_GROUP_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_DEBUG_SHARE_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Carapace Share
        CFBundleShortVersionString: "$(CARAPACE_MARKETING_VERSION)"
        CarapaceAppGroupIdentifier: "$(CARAPACE_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(CARAPACE_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  CarapaceActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/CarapaceActivityAttributes.swift
      # Shared continuous avatar waveform; dependency-free for widget isolation.
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/TalkWaveformView.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(CARAPACE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(CARAPACE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CARAPACE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(CARAPACE_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_DEBUG_ACTIVITY_WIDGET_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Carapace Activity
        CFBundleShortVersionString: "$(CARAPACE_MARKETING_VERSION)"
        CFBundleVersion: "$(CARAPACE_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CarapaceWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Sources/Services/WatchSessionActivationGate.swift
        group: Sources/Services
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
      - path: Sources/Permissions/PermissionRequestBridge.swift
        group: Sources/Permissions
      - path: Sources/Voice/TalkRealtimeClientSession.swift
        group: Sources/Voice
      - path: Resources/Licenses/str0m.txt
        buildPhase: resources
      # Universal talk waveform, compiled directly to keep the watch styling local.
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/TalkWaveformView.swift
        group: Shared
      # Universal mascot, compiled directly to keep the watch styling local.
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/CarapaceMascotView.swift
        group: Shared
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/CarapaceMascotAnimator.swift
        group: Shared
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/CarapaceMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: CarapaceKit
        product: CarapaceKit
      - sdk: AppIntents.framework
      - sdk: AVFAudio.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    preBuildScripts:
      - name: Build Watch WebRTC
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../shared/CarapaceWatchRTC/build.sh" \
            "$PLATFORM_NAME" "$DERIVED_FILE_DIR/WatchRTC" $ARCHS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(CARAPACE_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(CARAPACE_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(CARAPACE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(CARAPACE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CARAPACE_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        CARAPACE_COMPANION_APP_BUNDLE_ID: "$(CARAPACE_APP_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(CARAPACE_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/../shared/CarapaceWatchRTC/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/CarapaceWatchRTC/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(DERIVED_FILE_DIR)/WatchRTC"
        OTHER_LDFLAGS: "$(inherited) -lcarapace_watch_rtc"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          CARAPACE_COMPANION_APP_BUNDLE_ID: "$(CARAPACE_DEBUG_APP_BUNDLE_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_DEBUG_WATCH_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Carapace
        CFBundleShortVersionString: "$(CARAPACE_MARKETING_VERSION)"
        CFBundleVersion: "$(CARAPACE_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(CARAPACE_COMPANION_APP_BUNDLE_ID)"
        WKApplication: true
        WKPrefersNetworkUponForeground: true
        NSLocalNetworkUsageDescription: Carapace connects this Apple Watch directly to your Gateway on trusted local networks.
        NSMicrophoneUsageDescription: Carapace uses the microphone for voice conversations you start on Apple Watch.
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

  CarapaceTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
      - path: ../macos/Tests/CarapaceIPCTests/GatewayWebSocketTestSupport.swift
        group: Tests
      - path: ../shared/CarapaceKit/Tests/CarapaceKitTests/NativeGatewayWebSocketFixture.swift
        group: Tests
      - path: ../shared/CarapaceKit/Tests/CarapaceKitTests/ChatMermaidRenderModelTests.swift
        group: Tests
      - path: ../shared/CarapaceKit/Tests/CarapaceKitTests/ChatSelectableTextViewTests.swift
        group: Tests
      - path: ../shared/CarapaceKit/Tests/CarapaceKitTests/ChatPasteboardTests.swift
        group: Tests
      - path: WatchApp/Sources/WatchDeferredPayloadOrdering.swift
        group: WatchApp/Sources
    dependencies:
      - target: Carapace
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(CARAPACE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(CARAPACE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CARAPACE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Carapace.app/Carapace"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_DEBUG_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(CARAPACE_MARKETING_VERSION)"
        CFBundleVersion: "$(CARAPACE_BUILD_VERSION)"

  CarapaceLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
      - path: ShareExtension/ShareDraftComposer.swift
        group: ShareExtension
      - path: ShareExtension/ShareContentExtractor.swift
        group: ShareExtension
      - path: ShareExtension/ShareComposeState.swift
        group: ShareExtension
      - path: ShareExtension/ShareAttachmentSummary.swift
        group: ShareExtension
      - path: WatchApp/Sources/WatchVoiceTurnTracker.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchInboxMessages.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchMascot.swift
        group: WatchApp/Sources
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/CarapaceMascotView.swift
        group: Shared
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/CarapaceMascotAnimator.swift
        group: Shared
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/CarapaceMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/CarapaceKit/Sources/CarapaceChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
    dependencies:
      - package: CarapaceKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(CARAPACE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(CARAPACE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CARAPACE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_DEBUG_APP_BUNDLE_ID).logic-tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(CARAPACE_MARKETING_VERSION)"
        CFBundleVersion: "$(CARAPACE_BUILD_VERSION)"

  CarapaceUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: Carapace
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(CARAPACE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(CARAPACE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CARAPACE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Carapace
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_DEBUG_APP_BUNDLE_ID).ui-tests"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: CarapaceUITests
        CFBundleShortVersionString: "$(CARAPACE_MARKETING_VERSION)"
        CFBundleVersion: "$(CARAPACE_BUILD_VERSION)"

  CarapaceWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: WatchTests
    dependencies:
      - target: CarapaceWatchApp
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(CARAPACE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(CARAPACE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(CARAPACE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_WATCH_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CarapaceWatchApp.app/CarapaceWatchApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/../shared/CarapaceWatchRTC/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/CarapaceWatchRTC/include"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(CARAPACE_DEBUG_WATCH_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(CARAPACE_MARKETING_VERSION)"
        CFBundleVersion: "$(CARAPACE_BUILD_VERSION)"
